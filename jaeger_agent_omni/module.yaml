# module.yaml — the manifest JaegerOS's discover_modules() reads.
#
# The live implementation is production-candidate research. This manifest is
# the JaegerOS slot contract; `live.py` and `core/runtime/` are the directly
# runnable path. See STATUS.md for the remaining physical promotion gates.

module: "jaeger_agent_omni"

# Not `stt` and not `tts` — this module replaces the *pair*, plus cognition,
# with one neural path. That is the whole point: text stops being the
# mandatory bridge between hearing and speaking.
slot: "omni"

version: 0.1.0

# engine — fills a capability slot. Swapping in MiniCPM-o, or a future
# Jaeger-native backbone, means swapping this module, not editing it.
kind: engine

# The JaegerOS module consumes shared microphone PCM. The standalone live/demo
# entry points may own a selected device directly.
consumes:
  - /sense/mic/pcm

# Three outputs off one forward pass. text and actions flow toward the system;
# the performance spec flows toward the voice and the face.
#
# Speech is NEVER parsed back into commands. Actions travel on /act/tool/call
# and nowhere else — a character saying "I'll delete that file" as dialogue
# must not delete a file.
produces:
  - /sense/stt/transcript      # parallel text output, for logs/RAG/debug
  - /act/performance/spec      # PerformanceSpec -> tts slot + animation slot
  - /act/tool/call             # structured actions

# Cognition, speech generation and rig control are learned. Nothing here has
# physical authority — deterministic systems keep the final say over anything
# that moves. See dev/jaeger long term neural architecture.md, "Safety remains
# deterministic".
safety_critical: false
